["Konsep 2: Try-On 360° / Product Showcase","Tampilan Asli Tanpa Filter (Real Lighting)","Perlihatkan produk dari berbagai sudut di bawah cahaya alami. Gerakkan bahan kain, perlihatkan kerapian resleting dan jahitan agar penonton yakin dengan kualitas fisiknya."],
["Konsep 3: Uji Fitur & Pembuktian Spesifikasi","Tes Pembuktian Janji Deskripsi Toko","Buktikan satu per satu spesifikasi produk secara langsung (misal: celana ditarik untuk tes kelenturan karet, botol dibalik anti tumpah, es batu dibiarkan berjam-jam)."],
["Konsep 4: A Day in My Life / Mix & Match","Inspirasi Padu Padan & Penggunaan Nyata","Tunjukkan bagaimana produk dipakai beraktivitas sehari-hari: dipadukan untuk ke kantor/kampus, atau botol minum yang pas di kompartemen tas saat mobilitas tinggi."],
["Konsep 5: FOMO & Urgensi Keranjang Kuning","Informasi Paket Bundel & Kupon Diskon Toko","“Beli 1 nanggung, ambil paket promo isi 2 atau klaim voucher toko mumpung masih aktif”. Arahkan jari menunjuk ke arah keranjang kuning sebelum stok habis."]];
const MN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const DN=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
let acc=1;try{acc=+localStorage.getItem('acc')||1}catch(e){}
let cur=new Date(),sel=new Date();
const $=id=>document.getElementById(id);
const same=(a,b)=>a.getDate()==b.getDate()&&a.getMonth()==b.getMonth()&&a.getFullYear()==b.getFullYear();
function initSel(){MN.forEach((n,i)=>$('ms').add(new Option(n,i)));const y=new Date().getFullYear();for(let i=y-2;i<=y+6;i++)$('ys').add(new Option(i,i))}
function cal(){const y=cur.getFullYear(),m=cur.getMonth();$('ms').value=m;$('ys').value=y;const g=$('cd');g.innerHTML="";
for(let i=0;i<new Date(y,m,1).getDay();i++){g.insertAdjacentHTML('beforeend','<div class="d e"></div>')}
const td=new Date();
for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const dt=new Date(y,m,d),c=document.createElement('div');c.className='d'+(same(dt,td)?' t':'')+(same(dt,sel)?' s':'');c.innerHTML=d+'<div class="dot"></div>';c.onclick=()=>{sel=dt;cal();day()};g.appendChild(c)}}
function day(){const A=ACC[acc],dow=sel.getDay(),s=A.d[dow];
$('sub').textContent=A.sub;
document.querySelectorAll('.acc button').forEach(b=>b.classList.toggle('on',+b.dataset.a==acc));
$('ad').textContent=`${DN[dow]}, ${sel.getDate()} ${MN[sel.getMonth()]} ${sel.getFullYear()}`;
$('af').textContent=s[0];$('tb').innerHTML=A.tg(dow);
$('st').textContent=`📦 Daftar ${s[1].length} Jenis Produk${acc==1?' Yang Harus Dicari':' Hari Ini'}`;
const L=$('pl');L.innerHTML="";
s[1].forEach((it,i)=>{const c=document.createElement('div');c.className='pc';
c.innerHTML=`<div class="top"><div class="ix">${i+1}</div><div class="pn">${it[0]}</div><span class="bs ${CLS[it[1]]}">${it[1]}</span></div><div class="kw"><span>${it[2]}</span><button class="cp" data-k="${it[2]}">📋 Salin</button></div><div class="cr"><b>Catatan:</b> ${it[3]}</div><button class="bi" data-t="${it[0]}">🎬 Buat 5 Konsep Video Untuk Produk Ini</button>`;L.appendChild(c)});
L.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{const k=b.dataset.k;try{navigator.clipboard.writeText(k).then(()=>toast(`Kata kunci disalin: “${k}”`))}catch(e){toast(k)}});
L.querySelectorAll('.bi').forEach(b=>b.onclick=()=>{$('mt').textContent=b.dataset.t;$('cl').innerHTML=CONCEPTS.map(c=>`<div class="ci"><div class="ct">${c[0]}</div><div class="ch">${c[1]}</div><div class="cd">${c[2]}</div></div>`).join("");$('vm').classList.add('on')})}
function toast(m){const t=$('ts');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.querySelectorAll('.acc button').forEach(b=>b.onclick=()=>{acc=+b.dataset.a;try{localStorage.setItem('acc',acc)}catch(e){}day()});
$('ms').onchange=e=>{cur.setMonth(+e.target.value);cal()};
$('ys').onchange=e=>{cur.setFullYear(+e.target.value);cal()};
$('pm').onclick=()=>{cur.setMonth(cur.getMonth()-1);cal()};
$('nm').onclick=()=>{cur.setMonth(cur.getMonth()+1);cal()};
$('cx').onclick=()=>$('vm').classList.remove('on');
$('vm').onclick=e=>{if(e.target==$('vm'))$('vm').classList.remove('on')};
initSel();cal();day();
</script>
</body>
</html>
